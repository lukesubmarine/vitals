<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101311"><link rel="manifest" href="./manifest.webmanifest">
<title>VITALS — First Aid Training Application</title>
<style>
@font-face{font-family:Gotham;src:url('./Gotham Book.otf')}@font-face{font-family:Gotham;src:url('./Gotham Black.otf');font-weight:900}
:root{color-scheme:dark;--bg:#090c0b;--panel:#141a17;--ink:#f4f7f5;--muted:#9aa8a0;--green:#176b56;--line:#29352f;--r:30px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1b3028,transparent 42%),var(--bg);color:var(--ink);font-family:Gotham,Arial,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{cursor:pointer}.app{width:min(900px,100%);margin:auto;padding:22px 18px 55px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:900;letter-spacing:.16em;font-size:13px}.small{border:1px solid var(--line);background:#111714;color:var(--muted);padding:10px 16px;border-radius:999px}
.page{display:none}.page.active{display:block}.hero{text-align:center;padding:clamp(60px,14vh,125px) 0 35px}.hero h1{font-size:clamp(68px,16vw,116px);line-height:.85;letter-spacing:.04em;margin:0;font-weight:900}.hero h2{font-size:clamp(12px,3vw,18px);letter-spacing:.16em;font-weight:900;margin:22px 0 0;color:#c4d0c9}
.searchwrap{position:relative;max-width:660px;margin:auto}.search{width:100%;border:1px solid #33433b;background:#151c18;border-radius:999px;padding:20px 25px 20px 58px;color:var(--ink);outline:none}.search:focus,.field:focus{border-color:#31866c;box-shadow:0 0 0 4px #176b5630}.glass{position:absolute;left:23px;top:50%;transform:translateY(-50%);color:#9aafa3;font-size:21px}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:15px 0}.results{max-width:660px;margin:12px auto;display:grid;gap:9px}.result{width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:23px;padding:16px 19px;display:flex;justify-content:space-between;align-items:center}.result small{display:block;color:var(--muted);margin-top:5px;font-size:11px}.arrow{color:#70b99b;font-size:21px}.empty{border:1px dashed #405047;border-radius:25px;padding:22px;text-align:center;color:var(--muted);line-height:1.6}
.primary,.secondary,.danger{border:0;border-radius:999px;padding:13px 19px;font-weight:900}.primary{background:var(--green);color:white}.secondary{background:#222c26;color:#e4eee8;border:1px solid #35443b}.danger{background:#3a2020;color:#ffdede;border:1px solid #663939}
.head{padding:35px 0 18px}.back{background:none;border:0;color:#9db5a8;padding:8px 0}.head h1{font-size:clamp(29px,7vw,46px);margin:16px 0 5px;font-weight:900}.head p{color:var(--muted);font-size:13px;margin:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:7px;background:#111714;border:1px solid var(--line);border-radius:999px;margin:20px 0}.tab{border:0;background:transparent;color:#94a49a;border-radius:999px;padding:13px 5px;font-size:12px;font-weight:900;letter-spacing:.1em}.tab.active{background:var(--green);color:white}
.meta{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 14px}.meta strong{font-size:13px;letter-spacing:.06em}.meta span{font-size:12px;color:var(--muted)}
.criteria{display:grid;gap:10px}.criterion{display:flex;align-items:flex-start;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:23px;padding:16px}.criterion.done{border-color:#245b49;background:#132019}
.tick{appearance:none;width:24px;height:24px;flex:0 0 24px;border:2px solid #52645a;border-radius:9px;background:#0d120f;margin:0}.tick:checked{background:var(--green);border-color:#2c9a79}.tick:checked:after{content:"✓";display:block;text-align:center;color:white;font-weight:900}.criterion label{font-size:14px;line-height:1.5;flex:1}.criterion.done label{color:#9db8aa}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}.editor{display:none;background:#111714;border:1px solid var(--line);border-radius:27px;padding:18px;margin:16px 0}.editor.open{display:block}.editor h3{margin:0 0 14px;font-size:14px}.field{width:100%;background:#090e0b;border:1px solid #34443a;border-radius:17px;padding:13px 15px;color:var(--ink);outline:none}.editlist{display:grid;gap:9px}.editrow textarea{min-height:58px;resize:vertical}.editrow{display:flex;gap:8px}.editrow textarea{flex:1}.editbuttons{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}
.modalbg{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modalbg.open{display:flex}.modal{width:min(560px,100%);background:#151c18;border:1px solid #35443b;border-radius:30px;padding:23px}.modal h2{margin:0 0 8px;font-size:23px}.modal p{color:var(--muted);font-size:13px}.modal label{display:block;font-size:12px;margin:14px 0 7px}.modalbuttons{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.footer{text-align:center;color:#607168;font-size:10px;letter-spacing:.12em;padding:35px 0}
@media(min-width:700px){.app{padding-left:32px;padding-right:32px}.criteria{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app">
<div class="top"><span>VITALS</span><button class="small" id="home">HOME</button></div>
<main id="homePage" class="page active"><section class="hero"><h1>VITALS</h1><h2>FIRST AID TRAINING APPLICATION</h2></section>
<div class="searchwrap"><span class="glass">⌕</span><input id="search" class="search" placeholder="Search a first aid scenario…" autocomplete="off"></div>
<p class="hint">Search by condition, symptom or common description</p><div id="results" class="results"></div><div class="footer">PRACTISE • REVIEW • IMPROVE</div></main>
<main id="detailPage" class="page"><div class="head"><button class="back" id="back">← BACK TO SEARCH</button><h1 id="title"></h1><p id="desc"></p></div>
<div class="tabs"><button class="tab active" data-level="1">LEVEL 1</button><button class="tab" data-level="2">LEVEL 2</button><button class="tab" data-level="3">LEVEL 3</button></div>
<div class="meta"><strong id="levelName">FOUNDATION</strong><span id="count"></span></div><div id="criteria" class="criteria"></div>
<div class="actions"><button class="secondary" id="edit">EDIT THIS LEVEL</button><button class="secondary" id="rename">EDIT CHECKLIST</button><button class="danger" id="delete">DELETE CHECKLIST</button></div>
<section class="editor" id="editor"><h3 id="editHeading">EDIT LEVEL</h3><div id="editList" class="editlist"></div><div class="editbuttons"><button class="secondary" id="cancelEdit">CANCEL</button><button class="primary" id="saveEdit">SAVE CHANGES</button></div></section><div class="footer">VITALS • FIRST AID TRAINING APPLICATION</div></main></div>
<div class="modalbg" id="createModal"><div class="modal"><h2>CREATE CHECKLIST</h2><p>Add a scenario, then edit its criteria on each level.</p><label>CHECKLIST NAME</label><input id="newTitle" class="field" placeholder="e.g. Nosebleed"><label>DESCRIPTION / SEARCH TERMS</label><input id="newDesc" class="field" placeholder="Optional keywords"><div class="modalbuttons"><button class="secondary" id="cancelCreate">CANCEL</button><button class="primary" id="create">CREATE</button></div></div></div>
<div class="modalbg" id="renameModal"><div class="modal"><h2>EDIT CHECKLIST</h2><label>NAME</label><input id="renameTitle" class="field"><label>DESCRIPTION / SEARCH TERMS</label><input id="renameDesc" class="field"><div class="modalbuttons"><button class="secondary" id="cancelRename">CANCEL</button><button class="primary" id="saveRename">SAVE</button></div></div></div>
<script>
const topics=[
["Unconscious but breathing","unresponsive, passed out, recovery position","unconscious unresponsive passed out fainted"],
["Cardiac arrest — CPR and AED","collapse, not breathing normally, defibrillator","cardiac arrest cpr aed defibrillator"],
["Severe bleeding","haemorrhage, haemorrhaging, blood loss, wound","bleeding haemorrhage hemorrhage haemorrhaging"],
["Burns and scalds","thermal burn, hot liquid, chemical or electrical burn","burn burns scald hot water"],
["Choking — blocked airways","airway obstruction, foreign object","choking blocked airway blocked airways"],
["Asthma attack","wheezing, difficulty breathing, constricted breathing","asthma wheezing difficulty breathing constricted breathing"],
["Anaphylaxis","severe allergic reaction, adrenaline autoinjector","anaphylaxis allergy allergic reaction epipen"],
["Epileptic seizure","fit, convulsion, epilepsy","seizure fit convulsion epilepsy"],
["Suspected fracture","broken bone, limb injury","fracture broken bone sprain"],
["Heat exhaustion and heatstroke","overheating, heat illness","heat exhaustion heatstroke heat stroke overheating"],
["Hypoglycaemia — low blood sugar","diabetes, hypo","hypoglycaemia hypoglycemia low blood sugar hypo"],
["Stroke","facial droop, weakness, slurred speech, FAST","stroke facial droop weakness slurred speech fast"]
];
const levelLabels=["FOUNDATION","DEVELOPING","DETAILED"];
const counts=[5,10,15];
const templates=[
["Recognises the scenario and identifies the main concern.","Checks the scene for danger before approaching.","Gets appropriate help and communicates clearly.","Provides suitable immediate support within their training.","Monitors the person and seeks further help if their condition changes."],
["Introduces themselves and gains cooperation where possible.","Uses a structured approach to check immediate safety.","Identifies relevant signs and symptoms.","Asks focused questions about what happened and when.","Calls emergency services when indicated.","Chooses an appropriate first-aid response within their training.","Explains actions and reassures the person.","Avoids actions that could worsen the situation.","Reassesses the person's condition after intervention.","Provides a concise handover to the next level of care."],
["Completes a systematic scene-safety and personal-protection check.","Identifies immediate life threats and prioritises them.","Assesses responsiveness and the person's ability to communicate.","Checks relevant symptoms, onset, mechanism and medical history.","Recognises signs that require urgent escalation.","Activates emergency response promptly and delegates tasks clearly.","Selects an intervention consistent with current accredited training.","Explains the purpose of each action and obtains cooperation where possible.","Uses equipment appropriately and checks it is suitable.","Avoids contraindicated, unnecessary or unsafe interventions.","Reassesses after each significant intervention.","Monitors for deterioration and anticipates likely complications.","Maintains the person's dignity, warmth and comfort.","Records key observations, timings and interventions.","Gives a structured handover, including changes and response to care."]
];
const synonyms={"bleeding":["haemorrhage","hemorrhage","haemorrhaging","blood loss"],"haemorrhage":["bleeding","hemorrhage"],"difficulty breathing":["constricted breathing","shortness of breath","asthma"],"constricted breathing":["difficulty breathing","shortness of breath"],"choking":["blocked airways","blocked airway","airway obstruction"],"blocked airways":["choking","airway obstruction"]};
const makeCriteria=(topic,lvl)=>templates[lvl-1].slice(0,counts[lvl-1]).map(x=>x.replaceAll("the scenario",topic[0].toLowerCase()));
let store;try{store=JSON.parse(localStorage.getItem("vitals-store")||"null")}catch(e){}
if(!store){store=topics.map((t,i)=>({id:"starter-"+i,name:t[0],desc:t[1],aliases:t[2],levels:[1,2,3].map(n=>makeCriteria(t,n)),checks:[[],[],[]]}))}
let current=null,level=1;
const $=id=>document.getElementById(id),norm=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function save(){localStorage.setItem("vitals-store",JSON.stringify(store))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function lev(a,b){let r=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=r[0];r[0]=i;for(let j=1;j<=b.length;j++){let v=r[j];r[j]=Math.min(r[j]+1,r[j-1]+1,p+(a[i-1]===b[j-1]?0:1));p=v}}return r[b.length]}
function rank(item,q){let n=norm(q),all=[norm(item.name),norm(item.desc),...(item.aliases||"").split(" ").map(norm)],exp=[n,...(synonyms[n]||[]).map(norm)];if(all.includes(n))return 100;if(all.some(x=>x.includes(n)||n.includes(x)))return 85;if(exp.some(e=>all.some(x=>x.includes(e))))return 80;let words=n.split(" "),hay=all.join(" ");let hits=words.filter(w=>w.length>2&&hay.includes(w)).length;if(hits)return 45+hits*10/words.length;let best=0;if(n.length>4)all.forEach(x=>x.split(" ").forEach(w=>best=Math.max(best,1-lev(n,w)/Math.max(n.length,w.length))));return best>.72?45:0}
function search(){let q=$("search").value.trim(),box=$("results");box.innerHTML="";if(!q){box.innerHTML='<p class="hint">Try “bleeding”, “choking”, “difficulty breathing” or “stroke”.</p>';return}let hits=store.map(x=>({x,s:rank(x,q)})).filter(x=>x.s>=35).sort((a,b)=>b.s-a.s).slice(0,12);hits.forEach(({x})=>{let b=document.createElement("button");b.className="result";b.innerHTML=`<span>${esc(x.name)}<small>${esc(x.desc||"First aid training checklist")}</small></span><span class="arrow">›</span>`;b.onclick=()=>open(x.id);box.append(b)});if(!hits.length||!hits.some(h=>norm(h.x.name)===norm(q))){let e=document.createElement("div");e.className="empty";e.innerHTML=`${hits.length?"Not what you need?":"No matching checklist found."}<br><button class="primary" id="make" style="margin-top:13px">＋ CREATE “${esc(q.toUpperCase())}” CHECKLIST</button>`;box.append(e);$("make").onclick=()=>showCreate(q)}}
function open(id){current=store.find(x=>x.id===id);level=1;$("homePage").classList.remove("active");$("detailPage").classList.add("active");$("editor").classList.remove("open");draw();scrollTo(0,0)}
function draw(){if(!current)return;current.checks??=[[],[],[]];$("title").textContent=current.name;$("desc").textContent=current.desc||"FIRST AID TRAINING CHECKLIST";document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",+b.dataset.level===level));$("levelName").textContent=levelLabels[level-1];let arr=current.levels[level-1],checks=current.checks[level-1]||[];$("count").textContent=`${checks.filter(Boolean).length} / ${arr.length} COMPLETE`;$("criteria").innerHTML="";arr.forEach((v,i)=>{let row=document.createElement("div");row.className="criterion"+(checks[i]?" done":"");row.innerHTML=`<input class="tick" type="checkbox" id="ck${i}" ${checks[i]?"checked":""}><label for="ck${i}">${esc(v)}</label>`;row.querySelector("input").onchange=e=>{current.checks[level-1][i]=e.target.checked;save();draw()};$("criteria").append(row)})}
function home(){current=null;$("detailPage").classList.remove("active");$("homePage").classList.add("active");search();scrollTo(0,0)}
function showCreate(q=""){$("newTitle").value=q;$("newDesc").value="";$("createModal").classList.add("open")}
$("search").addEventListener("input",search);$("home").onclick=home;$("back").onclick=home;
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{level=+b.dataset.level;$("editor").classList.remove("open");draw()});
function edit(){let arr=current.levels[level-1];$("editHeading").textContent="EDIT LEVEL "+level;$("editList").innerHTML=arr.map((v,i)=>`<div class="editrow"><textarea class="field" rows="2" aria-label="Criterion ${i+1}">${esc(v)}</textarea></div>`).join("");$("editor").classList.add("open");$("editor").scrollIntoView({behavior:"smooth"})}
$("edit").onclick=()=>$("editor").classList.contains("open")?$("editor").classList.remove("open"):edit();
$("cancelEdit").onclick=()=>$("editor").classList.remove("open");
$("saveEdit").onclick=()=>{current.levels[level-1]=[...$("editList").querySelectorAll("textarea")].map(x=>x.value.trim()||"Add a criterion.");current.checks[level-1]=[];save();$("editor").classList.remove("open");draw()};
$("create").onclick=()=>{let name=$("newTitle").value.trim();if(!name)return;let desc=$("newDesc").value.trim(),id="custom-"+Date.now();let topic=[name,desc,desc.toLowerCase()];let item={id,name,desc,aliases:desc.toLowerCase(),levels:[1,2,3].map(n=>Array.from({length:counts[n-1]},()=> "Edit this criterion to suit your training standard.")),checks:[[],[],[]]};store.push(item);save();$("createModal").classList.remove("open");open(id);edit()};
$("cancelCreate").onclick=()=>$("createModal").classList.remove("open");
$("rename").onclick=()=>{$("renameTitle").value=current.name;$("renameDesc").value=current.desc||"";$("renameModal").classList.add("open")};
$("cancelRename").onclick=()=>$("renameModal").classList.remove("open");
$("saveRename").onclick=()=>{current.name=$("renameTitle").value.trim()||current.name;current.desc=$("renameDesc").value.trim();save();$("renameModal").classList.remove("open");draw()};
$("delete").onclick=()=>{if(confirm(`Delete "${current.name}" and all its criteria?`)){store=store.filter(x=>x.id!==current.id);save();home()}};
search();
if("serviceWorker"in navigator&&location.protocol!=="file:")addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
</script></body></html>
